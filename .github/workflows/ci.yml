name: Test and verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m growth_decision_engine demo --output outputs/demo-scorecard.json
      - run: >-
          python -m growth_decision_engine decision-shadow
          --scorecard outputs/demo-scorecard.json --provider fixture
          --output outputs/shadow-fixture.json
      - run: >-
          python -m growth_decision_engine cognee-context
          --scorecard outputs/demo-scorecard.json --query "refund reconciliation"
          --response-file growth_decision_engine/fixtures/cognee-chunks.synthetic.json
          --output outputs/cognee-context.json
      - run: >-
          python -m growth_decision_engine proposal-bench
          --scorecard outputs/demo-scorecard.json
          --suite growth_decision_engine/fixtures/proposal-bench.synthetic.json
          --output outputs/proposal-bench.json
      - run: >-
          python -m growth_decision_engine verify
          --assignments growth_decision_engine/fixtures/assignments.synthetic.csv
          --outcomes growth_decision_engine/fixtures/outcomes.synthetic.csv
          --costs growth_decision_engine/fixtures/costs.synthetic.csv
          --plan growth_decision_engine/fixtures/plan.synthetic.json
          --scorecard outputs/demo-scorecard.json
      - run: >-
          python -m growth_decision_engine pilot
          --assignments growth_decision_engine/fixtures/assignments.synthetic.csv
          --outcomes growth_decision_engine/fixtures/outcomes.synthetic.csv
          --costs growth_decision_engine/fixtures/costs.synthetic.csv
          --billing growth_decision_engine/fixtures/billing.synthetic.csv
          --spend growth_decision_engine/fixtures/spend.synthetic.csv
          --plan growth_decision_engine/fixtures/plan.synthetic.json
          --manifest growth_decision_engine/fixtures/pilot.synthetic.json
          --output outputs/pilot-packet.json
      - run: >-
          python -m growth_decision_engine verify-pilot
          --assignments growth_decision_engine/fixtures/assignments.synthetic.csv
          --outcomes growth_decision_engine/fixtures/outcomes.synthetic.csv
          --costs growth_decision_engine/fixtures/costs.synthetic.csv
          --billing growth_decision_engine/fixtures/billing.synthetic.csv
          --spend growth_decision_engine/fixtures/spend.synthetic.csv
          --plan growth_decision_engine/fixtures/plan.synthetic.json
          --manifest growth_decision_engine/fixtures/pilot.synthetic.json
          --packet outputs/pilot-packet.json
      - run: >-
          python -m growth_decision_engine exposure-audit
          --provider posthog
          --assignments growth_decision_engine/fixtures/assignments.synthetic.csv
          --exposures growth_decision_engine/fixtures/posthog-exposures.synthetic.csv
          --plan growth_decision_engine/fixtures/plan.synthetic.json
          --flag-key checkout-experiment
          --expected-events 7
          --output outputs/posthog-exposure-audit.json
      - run: >-
          python -m growth_decision_engine exposure-audit
          --provider vercel
          --assignments growth_decision_engine/fixtures/assignments.synthetic.csv
          --exposures growth_decision_engine/fixtures/vercel-exposures.synthetic.csv
          --plan growth_decision_engine/fixtures/plan.synthetic.json
          --flag-key checkout-experiment
          --expected-events 8
          --output outputs/vercel-exposure-audit.json
      - run: >-
          python -m growth_decision_engine cloudflare-audit
          --logs growth_decision_engine/fixtures/cloudflare-http.synthetic.ndjson
          --job-manifest growth_decision_engine/fixtures/cloudflare-job.synthetic.json
          --output outputs/cloudflare-audit.json
