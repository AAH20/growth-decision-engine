[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-decision-engine"
version = "0.1.0"
description = "Offline experiment-to-profit scorecards for product and marketing decisions"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
growth-decision = "growth_decision_engine.cli:main"

[tool.setuptools.packages.find]
include = ["growth_decision_engine*"]

[tool.setuptools.package-data]
growth_decision_engine = ["fixtures/*.csv"]
